name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU torch + project deps
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Smoke-train on synthetic data
        run: |
          python scripts/make_synthetic_data.py --out data/synthetic --n 120
          python -m src.train --data data/synthetic --epochs 2 --workers 0
          python -m src.evaluate --model models/pilotnet.pt --data data/synthetic --n 50
